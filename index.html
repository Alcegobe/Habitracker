<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Habitracker</title>
  <meta name="description" content="Suivez vos habitudes quotidiennes avec un calendrier visuel." />
  <meta name="theme-color" content="#0d1117" />
  <meta name="color-scheme" content="dark" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Habitracker" />

  <meta property="og:title" content="Habitracker" />
  <meta property="og:description" content="Suivez vos habitudes quotidiennes avec un calendrier visuel." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="icons/icon-512.png" />

  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <svg class="logo" viewBox="0 0 100 100" width="28" height="28" aria-hidden="true">
          <path fill="#1f8a3a" d="M50 6 Q 56 22 66 32 Q 78 44 80 60 Q 82 82 60 90 Q 50 93 40 90 Q 18 82 20 60 Q 22 44 34 32 Q 44 22 50 6 Z"/>
          <path fill="#39d353" d="M50 44 Q 55 54 61 62 Q 68 73 60 84 Q 50 90 40 84 Q 32 73 39 62 Q 45 54 50 44 Z"/>
        </svg>
        <h1>Habitracker</h1>
      </div>
      <div class="header-actions">
        <span class="today-badge hidden" id="todayBadge">0/0 aujourd'hui</span>
      </div>
    </div>
  </header>

  <main class="container">
    <button id="addHabitBtn" class="btn btn-primary btn-add" type="button">
      <span class="plus">+</span> Nouvelle habitude
    </button>

    <section id="habitsList" class="habits-list"></section>

    <section id="emptyState" class="empty-state hidden">
      <div class="empty-emoji">🎯</div>
      <p>Aucune habitude pour l'instant.<br>Touchez « Nouvelle habitude » pour commencer.</p>
    </section>
  </main>

  <footer class="app-footer">
    <p>Données stockées localement dans ton navigateur</p>
  </footer>

  <template id="habitTemplate">
    <article class="card habit-card">
      <header class="habit-header">
        <div class="habit-title-group">
          <span class="habit-emoji">🎯</span>
          <h3 class="habit-name"></h3>
        </div>
        <div class="habit-actions">
          <button class="btn btn-icon edit-btn" type="button" aria-label="Modifier">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path fill="currentColor" d="M11.013 1.427a1.75 1.75 0 012.474 0l1.086 1.086a1.75 1.75 0 010 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 01-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61zm1.414 1.06a.25.25 0 00-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 000-.354l-1.086-1.086zM11.189 6.25L9.75 4.81l-6.286 6.287a.253.253 0 00-.064.108l-.558 1.953 1.953-.558a.253.253 0 00.108-.064l6.286-6.286z"/>
            </svg>
          </button>
          <button class="btn btn-icon btn-danger delete-btn" type="button" aria-label="Supprimer">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path fill="currentColor" d="M11 1.75V3h2.25a.75.75 0 010 1.5H2.75a.75.75 0 010-1.5H5V1.75C5 .784 5.784 0 6.75 0h2.5C10.216 0 11 .784 11 1.75zM4.496 6.675a.75.75 0 10-1.492.15l.66 6.6A1.75 1.75 0 005.405 15h5.19c.9 0 1.652-.681 1.741-1.576l.66-6.6a.75.75 0 00-1.492-.149l-.66 6.6a.25.25 0 01-.249.225h-5.19a.25.25 0 01-.249-.225l-.66-6.6zM6.5 1.75V3h3V1.75a.25.25 0 00-.25-.25h-2.5a.25.25 0 00-.25.25z"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="habit-stats">
        <div class="stat">
          <div class="stat-label">Suite</div>
          <div class="stat-value">
            <span class="streak-count">0</span>
            <span class="stat-unit streak-label">jours</span>
          </div>
        </div>
        <div class="stat">
          <div class="stat-label">Record</div>
          <div class="stat-value">
            <span class="best-count">0</span>
            <span class="stat-unit">jours</span>
          </div>
        </div>
        <div class="stat">
          <div class="stat-label">Total</div>
          <div class="stat-value">
            <span class="total-count">0</span>
            <span class="stat-unit">cochés</span>
          </div>
        </div>
      </div>

      <div class="section-label">Cette semaine</div>
      <div class="week-strip"></div>

      <div class="section-label">Évolution</div>
      <div class="chart-tabs" role="tablist">
        <button class="chart-tab active" type="button" data-period="week">Sem.</button>
        <button class="chart-tab" type="button" data-period="month">Mois</button>
        <button class="chart-tab" type="button" data-period="quarter">Trim.</button>
        <button class="chart-tab" type="button" data-period="year">Année</button>
      </div>
      <svg class="chart-svg" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="chart-caption"></div>

      <div class="section-label">Vue annuelle</div>
      <div class="graph-wrapper">
        <div class="month-labels"></div>
        <div class="graph">
          <div class="weekday-labels">
            <span></span>
            <span>Lun</span>
            <span></span>
            <span>Mer</span>
            <span></span>
            <span>Ven</span>
            <span></span>
          </div>
          <div class="grid"></div>
        </div>
        <div class="legend">
          <span class="legend-label">Moins</span>
          <span class="day-cell dot-l0"></span>
          <span class="day-cell dot-l1"></span>
          <span class="day-cell dot-l2"></span>
          <span class="day-cell dot-l3"></span>
          <span class="day-cell dot-l4"></span>
          <span class="legend-label">Plus</span>
        </div>
      </div>
    </article>
  </template>

  <div id="modalOverlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h3 id="modalTitle">Nouvelle habitude</h3>
      <form id="habitForm">
        <div class="modal-field">
          <label class="field-label" for="habitFormName">Nom</label>
          <input
            type="text"
            id="habitFormName"
            class="input"
            placeholder="ex : lire 30 minutes"
            maxlength="60"
            required
            autocomplete="off"
          />
        </div>
        <div class="modal-field">
          <span class="field-label">Icône</span>
          <div class="emoji-grid" id="emojiGrid"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="modalCancel">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <div id="tooltip" class="tooltip hidden"></div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
