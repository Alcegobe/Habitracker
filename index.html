<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Habitracker</title>
  <meta name="description" content="Track daily habits with a GitHub-style contribution graph." />
  <meta name="theme-color" content="#0d1117" />
  <meta name="color-scheme" content="dark" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Habitracker" />

  <!-- Open Graph -->
  <meta property="og:title" content="Habitracker" />
  <meta property="og:description" content="Track daily habits with a GitHub-style contribution graph." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="icons/icon-512.png" />

  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <svg class="logo" viewBox="0 0 16 16" width="32" height="32" aria-hidden="true">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        <h1>Habitracker</h1>
      </div>
      <div class="header-actions">
        <span class="streak-badge" id="globalStreak">0 day streak</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card add-habit-card">
      <h2 class="card-title">New habit</h2>
      <form id="addHabitForm" class="add-habit-form">
        <input
          type="text"
          id="habitName"
          class="input"
          placeholder="e.g. Read 30 minutes"
          maxlength="60"
          required
        />
        <button type="submit" class="btn btn-primary">Add habit</button>
      </form>
    </section>

    <section id="habitsList" class="habits-list"></section>

    <section id="emptyState" class="empty-state hidden">
      <svg viewBox="0 0 16 16" width="48" height="48" aria-hidden="true">
        <path fill="currentColor" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"/>
      </svg>
      <p>No habits yet. Add one above to start tracking.</p>
    </section>
  </main>

  <footer class="app-footer">
    <p>Local data only · stored in your browser</p>
  </footer>

  <template id="habitTemplate">
    <article class="card habit-card">
      <header class="habit-header">
        <div class="habit-title-group">
          <h3 class="habit-name"></h3>
          <div class="habit-meta">
            <span class="habit-stat">
              <span class="dot dot-l4"></span>
              <span class="streak-count">0</span> day streak
            </span>
            <span class="habit-stat">
              <strong class="total-count">0</strong> total
            </span>
          </div>
        </div>
        <div class="habit-actions">
          <button class="btn btn-success today-btn" type="button">Mark today</button>
          <button class="btn btn-danger delete-btn" type="button" aria-label="Delete habit">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path fill="currentColor" d="M11 1.75V3h2.25a.75.75 0 010 1.5H2.75a.75.75 0 010-1.5H5V1.75C5 .784 5.784 0 6.75 0h2.5C10.216 0 11 .784 11 1.75zM4.496 6.675a.75.75 0 10-1.492.15l.66 6.6A1.75 1.75 0 005.405 15h5.19c.9 0 1.652-.681 1.741-1.576l.66-6.6a.75.75 0 00-1.492-.149l-.66 6.6a.25.25 0 01-.249.225h-5.19a.25.25 0 01-.249-.225l-.66-6.6zM6.5 1.75V3h3V1.75a.25.25 0 00-.25-.25h-2.5a.25.25 0 00-.25.25z"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="graph-wrapper">
        <div class="month-labels"></div>
        <div class="graph">
          <div class="weekday-labels">
            <span></span>
            <span>Mon</span>
            <span></span>
            <span>Wed</span>
            <span></span>
            <span>Fri</span>
            <span></span>
          </div>
          <div class="grid"></div>
        </div>
        <div class="legend">
          <span class="legend-label">Less</span>
          <span class="day-cell dot-l0"></span>
          <span class="day-cell dot-l1"></span>
          <span class="day-cell dot-l2"></span>
          <span class="day-cell dot-l3"></span>
          <span class="day-cell dot-l4"></span>
          <span class="legend-label">More</span>
        </div>
      </div>
    </article>
  </template>

  <div id="tooltip" class="tooltip hidden"></div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
